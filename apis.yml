aid: tdaycom
name: Tdaycom
description: >-
  tday (tday.com) is a Y Combinator-backed (Spring 2026) AI platform, operated by
  Altacomm Technologies Pty. Ltd. of Adelaide, South Australia, that turns what a
  software team ships into on-brand creative. It connects to a company's GitHub
  repository or drives a live site through the browser like a user, and on every release
  produces a launch package — an end-to-end demo video recorded from real product flows,
  a promotional feature showcase, and on-brand social graphics — then publishes that
  creative to social channels and measures how it performs. A second surface generates
  brand-aware still designs from a text prompt against a stored brand, where a brand is
  created from a website URL and its colors, fonts and logos are extracted automatically.
  tday operates with no SDK embedded in the customer's product, using isolated per-run
  workspaces and database branches, scoped repository access, secure credential storage,
  and secret redaction. Its developer surface is agent-shaped rather than REST-shaped:
  tday publishes no OpenAPI, and instead ships a hosted Model Context Protocol server at
  https://tday.com/api/mcp secured with OAuth 2.1 (PKCE, dynamic client registration,
  RFC 8414 / RFC 9728 discovery), a local stdio MCP server distributed on npm as
  @designtday/mcp, and five of its own packaged agent skills.
