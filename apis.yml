aid: tdaycom
name: Tdaycom
description: >-
  tday (tday.com) is a Y Combinator-backed (Spring 2026) AI platform that turns a
  software product into on-brand marketing content. It connects to a company's GitHub
  repository or live website, and on every release automatically produces a launch
  package — an end-to-end demo video generated from real product flows, feature
  showcases, and on-brand social graphics and ads — then publishes that creative to
  social and ad channels and measures how it performs, closing the loop from what a
  team ships to what it posts. tday operates through the browser like a user, with no
  SDK embedded in the customer's product, using isolated per-run workspaces, scoped
  repository access, secure credential storage, and secret redaction. tday exposes a
  hosted Model Context Protocol (MCP) server at https://tday.com/api/mcp secured with
  OAuth 2.1 (PKCE, dynamic client registration, RFC 8414 / RFC 9728 discovery), making
  it the agent-facing surface of the platform.
