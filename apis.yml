apis:
- name: tday MCP Server
  description: >-
    Model Context Protocol server for tday, and the agent-facing entry point to the
    platform. It ships in two deployments that front the same nine tools: a hosted
    remote endpoint at https://tday.com/api/mcp, added through an MCP client's custom
    connector flow and secured with OAuth 2.1 (authorization_code + PKCE, dynamic
    client registration, single "tday" scope); and a local stdio server installed with
    `npx -y @designtday/mcp install`, which links a machine to a tday account through a
    loopback browser flow. Tools cover account/credit lookup, brand create/list/get,
    design list/get, asynchronous design generation with polling, and local image
    download. RFC 8414 authorization-server and RFC 9728 protected-resource metadata are
    published under /.well-known/.
  humanURL: https://tday.com/mcp
  baseURL: https://tday.com/api/mcp
  properties:
  - type: MCPServer
    url: mcp/tdaycom-mcp.yml
  - type: ToolCrosswalk
    url: mcp/tdaycom-tool-crosswalk.yml
