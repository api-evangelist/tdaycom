note: >-
  READ THE CAVEAT BEFORE USING THESE NUMBERS. tday's own pricing page states, twice,
  that the figures are not real: a footnote under the table reads "Pricing is
  illustrative", and an FAQ entry on the same page titled "Why is the pricing
  illustrative?" answers "Real cost depends on volume, resolution, and self-hosting. The
  numbers here are placeholders." Every tier routes to "Book a call" rather than to
  self-serve checkout. So tday publishes a pricing PAGE but not a purchasable price. The
  tiers are recorded verbatim below with placeholder: true on the amounts.
  Separately and inconsistently, the API/MCP surface is metered in credits — the
  tday_whoami tool returns an `apiBalance` and tday's own agent instructions say "Top up
  at https://tday.com/billing" — and none of that credit pricing is published anywhere.
