note: >-
  No OpenAPI and no object reference are published, so this graph is derived from the
  output schemas and route shapes in tday's own first-party client. Every schema in that
  package is `.passthrough()` — tday declares only the keys the client needs and lets
  the rest through — so the entities below are REAL but their attribute lists are
  necessarily incomplete. Attributes marked `named` appear explicitly in the package;
  attributes described in prose on https://tday.com/mcp are marked `documented`.
id_format:
